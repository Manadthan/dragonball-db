name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifications:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  base-de-donnees:
    name: Base de données (migrations, tests pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Libérer les ports de Supabase
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      - run: npx supabase db start
      - name: Tests pgTAP (schéma, Row Level Security)
        run: npm run db:test
      - name: Types TypeScript à jour avec le schéma
        run: |
          npx supabase gen types typescript --schema dragonball \
            | npx prettier --stdin-filepath src/types/database.ts > "$RUNNER_TEMP/database.ts"
          if ! diff -u src/types/database.ts "$RUNNER_TEMP/database.ts"; then
            echo "::error::src/types/database.ts n'est pas à jour : lancer npm run db:types"
            exit 1
          fi
