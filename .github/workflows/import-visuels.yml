name: Import des visuels du catalogue

# Exécute séquentiellement tous les scripts idempotents d'import de visuels
# (jaquettes DVD Pony Canyon / Toei Video, couvertures Glénat France, Jump Comics Japon,
# Shueisha Jump Remix et guides & artbooks japonais)
# dans un seul job après chaque déploiement de schéma sur main, afin d'éviter toute saturation
# de Supabase Storage et toute annulation automatique entre workflows concurrents.
on:
  workflow_run:
    workflows: ["Déploiement du schéma"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      forcer:
        description: "Remplacer aussi les visuels déjà présents"
        type: boolean
        default: false

concurrency:
  group: dragonball-visuels-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import-visuels:
    name: Publier les visuels manquants dans dragonball-visuels
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Importer les visuels manquants (DVD, Glénat, Jump Comics, Jump Remix, Guides & Artbooks Japon)
        run: |
          ARGS="--ecrire"
          if [ "${{ inputs.forcer }}" = "true" ]; then
            ARGS="--ecrire --forcer"
          fi
          node scripts/jaquettes-dbz-dvd.mjs $ARGS
          node scripts/jaquettes-glenat.mjs $ARGS
          node scripts/jaquettes-jump-comics.mjs $ARGS
          node scripts/jaquettes-jump-remix.mjs $ARGS
          node scripts/jaquettes-guides-artbooks-japon.mjs $ARGS
