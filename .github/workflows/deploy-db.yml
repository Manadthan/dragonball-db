name: Déploiement du schéma

# Applique supabase/migrations/*.sql sur le schéma dédié `dragonball` du projet Supabase partagé (mon-site-sdlc).
# Suivi dans `dragonball.schema_migrations` (jamais dans `supabase_migrations.schema_migrations`) pour ne pas
# interférer avec les migrations de `mon-site-sdlc`.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-db.yml"
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrations:
    name: Appliquer les migrations (schéma dragonball)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Vérifier les secrets
        run: |
          for nom in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!nom}" ]; then
              echo "::error::Secret GitHub manquant : $nom (Settings → Secrets and variables → Actions)"
              exit 1
            fi
          done
      - uses: actions/checkout@v5
      - name: Appliquer les nouvelles migrations dans le schéma dragonball
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.SUPABASE_PROJECT_REF;
          const endpoint = `https://api.supabase.com/v1/projects/${ref}/database/query`;

          async function runSql(query) {
            const res = await fetch(endpoint, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ query }),
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${text}`);
            return JSON.parse(text);
          }

          (async () => {
            await runSql(`
              create schema if not exists dragonball;
              create table if not exists dragonball.schema_migrations (
                version text primary key,
                applied_at timestamptz not null default now()
              );
            `);

            const appliedRows = await runSql(
              "select version from dragonball.schema_migrations order by version;"
            );
            const applied = new Set(appliedRows.map((r) => r.version));

            const dir = "supabase/migrations";
            const files = fs
              .readdirSync(dir)
              .filter((f) => f.endsWith(".sql"))
              .sort();

            for (const file of files) {
              if (applied.has(file)) {
                console.log(`Déjà appliquée : ${file}`);
                continue;
              }
              console.log(`Application : ${file}`);
              const sql = fs.readFileSync(path.join(dir, file), "utf8");
              const escaped = file.replace(/'/g, "''");
              await runSql(
                `begin;\n${sql}\ninsert into dragonball.schema_migrations (version) values ('${escaped}');\ncommit;`
              );
            }
            console.log("Migrations dragonball à jour.");
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
