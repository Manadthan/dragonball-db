name: Import des couvertures Jump Comics

# Télécharge les couvertures officielles Jump Comics Japon (Shueisha CloudFront 1200px HD, Rakuten Books et Amazon Japon),
# les convertit en WebP (300w + 680w) dans le bucket public `dragonball-visuels`,
# et met à jour `dragonball.objets.image_path` (idempotent : ne traite que les manquantes par défaut).
on:
  workflow_run:
    workflows: ["Déploiement du schéma"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      forcer:
        description: "Remplacer aussi les couvertures déjà présentes"
        type: boolean
        default: false

concurrency:
  group: dragonball-visuels-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import-couvertures:
    name: Publier les couvertures HD Jump Comics dans dragonball-visuels
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Importer les couvertures HD Jump Comics manquantes
        run: |
          if [ "${{ inputs.forcer }}" = "true" ]; then
            node scripts/jaquettes-jump-comics.mjs --ecrire --forcer
          else
            node scripts/jaquettes-jump-comics.mjs --ecrire
          fi
